name: "Central Automation Pipeline"

on:
  schedule:
    - cron: "35 9 * * 2"
      timezone: "America/New_York"
    - cron: "35 9 * * 6"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      task:
        description: "Automation task to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - topics

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Decide whether this scheduled run creates a post
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          run_post=true
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "35 9 * * 6" ]]; then
            day=$(TZ=America/New_York date +%-d)
            if (( day > 7 )); then
              run_post=false
            fi
          fi
          echo "run_post=$run_post" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.schedule.outputs.run_post == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: steps.schedule.outputs.run_post == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Configure pnpm
        if: steps.schedule.outputs.run_post == 'true'
        run: corepack enable pnpm

      - name: Install dependencies
        if: steps.schedule.outputs.run_post == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate post and image
        if: steps.schedule.outputs.run_post == 'true' && (github.event_name == 'schedule' || inputs.task == 'post')
        run: pnpm run start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CONTENT_STORAGE_PUBLIC_BASE_URL: ${{ secrets.IMAGE_STORAGE_PUBLIC_BASE_URL || secrets.CONTENT_STORAGE_PUBLIC_BASE_URL }}
          IMAGE_STORAGE_PUBLIC_BASE_URL: ${{ secrets.IMAGE_STORAGE_PUBLIC_BASE_URL || secrets.CONTENT_STORAGE_PUBLIC_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Create new topics
        if: steps.schedule.outputs.run_post == 'true' && github.event_name == 'workflow_dispatch' && inputs.task == 'topics'
        run: pnpm run generate:topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
