name: "Central Automation Pipeline"

on:
  schedule:
    - cron: "35 9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      task:
        description: "Automation task to run"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - topics

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.2.0
        with:
          node-version-file: ".nvmrc"

      - name: Configure pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate post and image
        if: github.event_name == 'schedule' || inputs.task == 'post'
        run: pnpm run start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CONTENT_STORAGE_PUBLIC_BASE_URL: ${{ secrets.IMAGE_STORAGE_PUBLIC_BASE_URL || secrets.CONTENT_STORAGE_PUBLIC_BASE_URL }}
          IMAGE_STORAGE_PUBLIC_BASE_URL: ${{ secrets.IMAGE_STORAGE_PUBLIC_BASE_URL || secrets.CONTENT_STORAGE_PUBLIC_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Create new topics
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'topics'
        run: pnpm run generate:topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
