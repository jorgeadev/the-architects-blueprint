name: "Resolve topics.json conflict"

on:
  push:
    branches:
      - agents/resolve-git-conflicts-guide

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run conflict resolution script
        run: python3 scripts/resolve-topics-conflict.py

      - name: Commit resolved topics and remove temp files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm scripts/resolve-topics-conflict.py
          git rm .github/workflows/resolve-topics-conflict.yml
          git add config/topics.json

          git commit -m "chore: resolve topics.json conflict - remove published topics, add new ones [skip ci]"
          git push
